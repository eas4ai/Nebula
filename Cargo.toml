[package]
name = "nebula"
version = "3.0.0"
rust-version = "1.94.0"
edition = "2024"
description = "A starter kit for Suprnova"
authors = ["eas4ai <shawn@eas4ai.com>"]

# Two binaries are declared below, so `cargo run` has to be told which
# one it means. Without `default-run` it refuses outright - it does NOT
# fall back to the binary sharing the package name - and every wrapper
# (`suprnova migrate`, `schedule:work`, `web:run`) fails before doing
# any work.
default-run = "nebula"

[[bin]]
name = "nebula"
path = "cmd/main.rs"

# Per-project console binary - runtime command dispatch (db:seed,
# user-defined `#[command]` async fns, etc.). Same crate, different
# `fn main` because console commands exit when their handler returns
# whereas the server binary loops forever.
[[bin]]
name = "console"
path = "src/bin/console.rs"

[dependencies]
# Production build shape: default features off, the eleven non-`testing`
# defaults listed explicitly, so the binaries above never carry a test
# seam. See the Suprnova manual, "Production build shape" (deployment.md).
suprnova = { git = "https://github.com/eas4ai/suprnova.git", tag = "v4.1.0", default-features = false, features = ["filesystem", "database-sqlite", "database-postgres", "database-mysql", "vector-mariadb", "web-push", "localization", "magnetar-oauth", "media", "queue-sqs", "reporting-sentry"] }
tokio = { version = "1", features = ["full"] }
sea-orm-migration = { version = "2.0", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-native-tls"] }
sea-orm = { version = "2.0", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-native-tls", "macros", "postgres-use-serial-pk"] }
serde = { version = "1.0", features = ["derive"] }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
validator = { version = "0.20", features = ["derive"] }
tracing = "0.1"
# Markdown twins of public pages for crawlers that do not run JavaScript
# (src/markdown.rs). It names the framework with the same tag, so both
# resolve to one `suprnova`.
suprnova-markdown = { git = "https://github.com/eas4ai/suprnova-markdown.git", tag = "v0.3.0" }

[dev-dependencies]
# Turns `testing` back on for `cargo test` and every `--tests` build
# only; it never reaches the binaries above. The suites use its
# `*_for_test` helpers.
suprnova = { git = "https://github.com/eas4ai/suprnova.git", tag = "v4.1.0", features = ["testing"] }
bytes = "1.11.1"
http-body-util = "0.1.3"
hyper = { version = "1.10.1", features = ["full"] }
hyper-util = { version = "0.1.20", features = ["full"] }
serde_json = "1.0.150"
